name: Modelos de IA

# Muestra que modelos de Gemini responden con la clave y cuantas consultas se usaron hoy.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modelos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Modelos
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python herramientas/modelos_ia.py
