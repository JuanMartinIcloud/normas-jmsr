name: Control de calidad

# Cada manana comprueba con datos que todo este completo y correcto (ver src/control.py). Solo lee.
# Lo lanza el programador de tareas a las 7:00 a. m. (hora de Lima); tambien se puede lanzar a mano.
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: bash src/reintentar.sh pip install -r requirements.txt
      - name: Comprobar
        run: python src/control.py
