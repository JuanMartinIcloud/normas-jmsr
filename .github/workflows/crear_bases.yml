name: Crear bases en Neon

# Se lanza a mano. Crea las bases de texto que falten en la cuenta de Neon del sistema nuevo.
on:
  workflow_dispatch:
    inputs:
      cantidad:
        description: "Cantidad de bases de texto"
        default: "7"

jobs:
  crear:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Crear bases
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: python herramientas/crear_bases.py "${{ github.event.inputs.cantidad || '7' }}"
