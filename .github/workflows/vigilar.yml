name: Alarma de consumo de Neon

# Lo lanza el programador de tareas (src/programador.py) a su hora; tambien se puede lanzar a mano.
on:
  workflow_dispatch:

jobs:
  vigilar:
    runs-on: ubuntu-latest
    # Una falla no marca la tarea como error: el programador la detecta y la repite sola
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: bash src/reintentar.sh pip install requests psycopg2-binary
      - name: Revisar limites
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: bash src/reintentar.sh python src/vigilar.py
